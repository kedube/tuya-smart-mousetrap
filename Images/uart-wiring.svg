  .cap { font-size: 12px; font-weight: 700; fill: #5f6368; letter-spacing: 0.08em; }
  .silk { font-size: 15px; font-weight: 700; fill: #1b1b1b; }
  .pin { font-size: 13px; font-weight: 700; fill: #ffffff; }
