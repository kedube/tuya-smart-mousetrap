<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="Wiring a USB-UART adapter to header P3 of the mouse trap through a 1x10 pitch adapter: adapter TX to RXD, adapter RX to TXD, 3.3 V to 3V3, GND to GND.">
<style>
